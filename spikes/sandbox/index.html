<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarn Sandbox</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header class="top">
        <div>
          <h1>Tarn Sandbox</h1>
          <p class="sub">Rain, wind, chimes and music from one shared world. Every sound is generated live; nothing loops.</p>
        </div>
      </header>

      <section class="stage">
        <canvas id="scene" aria-label="A lake at night. Ripples are raindrops, glowing tubes are chime strikes, orbs are music notes, coloured by pitch."></canvas>
      </section>

      <section class="transport">
        <button id="play" class="primary">▶ Play</button>
        <label class="inline">Volume <input id="volume" type="range" min="-40" max="0" step="0.5" value="-10" /> <output id="volume-out">−10.0 dB</output></label>
        <label class="inline">Key <select id="scale"></select></label>
        <span class="seed">Seed <code id="seed"></code> <button id="reseed" title="A different version of the same world">New seed</button></span>
      </section>
      <p id="error" class="error" role="alert" hidden></p>

      <section>
        <h2 class="label">Scenes</h2>
        <div id="scenes" class="wrap"></div>
      </section>

      <div id="strips" class="strips"></div>

      <section class="space-card">
        <h2 class="label">Space</h2>
        <div id="space" class="ctls"></div>
      </section>

      <pre id="status" class="status"></pre>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
