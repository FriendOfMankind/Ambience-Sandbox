<!doctype html><html><body><script type="module">
import { BedPlayer } from '../../src/audio/nature/BedPlayer';
window.runBedCheck = async (url, seed) => {
  const data = await (await fetch(url)).arrayBuffer();
  const fs = 44100, secs = 240;
  const ctx = new OfflineAudioContext(2, fs * secs, fs);
  const buf = await ctx.decodeAudioData(data);
  const bed = new BedPlayer(ctx, { seed, lookaheadSeconds: secs + 10 });
  bed.setBuffer(buf); bed.output.connect(ctx.destination); bed.start();
  const out = await ctx.startRendering();
  const L = out.getChannelData(0); const win = fs / 2; const rms = [];
  for (let i = fs * 3; i + win <= L.length - fs * 2; i += win) { let s = 0; for (let j = i; j < i + win; j++) s += L[j] * L[j]; rms.push(10 * Math.log10(s / win)); }
  const mean = rms.reduce((a, b) => a + b) / rms.length;
  return { seed, segments: bed.history.length, minDb: +(Math.min(...rms) - mean).toFixed(2), maxDb: +(Math.max(...rms) - mean).toFixed(2) };
};
</script></body></html>
